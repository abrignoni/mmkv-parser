name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The versions the LEAPP runtime-contract CI runs, so the copies vendored
        # into the cores are proven on every interpreter those tools support.
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the known-answer tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Install the package and run the console script
        run: |
          python -m pip install .
          mmkv-parser --help
